<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore IMDb episode ratings, titles, and summaries for television series.">
  <title>TV Episode Ratings</title>
  <link rel="icon" type="image/png" href="assets/site-icon.png">
  <link rel="apple-touch-icon" href="assets/site-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="TV Episode Ratings home">
      <img class="brand-mark" src="assets/site-icon.png" alt=""><span>TV Episode Ratings</span>
    </a>
    <span class="header-note">Episode ratings from IMDb</span>
  </header>

  <main class="home-shell">
    <section class="series-section" aria-labelledby="series-heading">
      <div class="section-heading">
        <h2 id="series-heading">Choose a collection</h2>
        <span id="series-count">Series</span>
      </div>
      <div class="series-grid" id="series-grid" aria-live="polite"></div>
    </section>

    <section class="legend-block" aria-label="Rating color legend">
      <span>Rating scale</span>
      <div class="legend" id="legend"></div>
    </section>
  </main>

  <footer><span>Ratings via IMDb datasets</span><span>Episode summaries via TVmaze &amp; IMDb</span></footer>
  <script type="module" src="app.js?v=2026-10-15-pokemon-zeo-movies"></script>
</body>
</html>
