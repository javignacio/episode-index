<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Season-by-season IMDb episode ratings.">
  <title>Series — Episode Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">EI</span><span>Episode Index</span></a>
    <a class="back-link" href="index.html">← All series</a>
  </header>

  <main class="show-shell" id="show-main">
    <div class="loading">Loading the episode grid…</div>
  </main>

  <dialog class="episode-dialog" id="episode-dialog">
    <button class="dialog-close" aria-label="Close episode details">×</button>
    <div class="dialog-rating" id="dialog-rating"></div>
    <p class="eyebrow" id="dialog-code"></p>
    <h2 id="dialog-title"></h2>
    <p class="dialog-summary" id="dialog-summary"></p>
    <div class="dialog-meta" id="dialog-meta"></div>
    <a class="imdb-link" id="dialog-link" target="_blank" rel="noopener">View on IMDb ↗</a>
  </dialog>

  <footer><span>Ratings via IMDb datasets</span><span>Episode summaries via TVmaze</span></footer>
  <script type="module" src="show.js"></script>
</body>
</html>
